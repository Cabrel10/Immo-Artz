name: CI

on:
  push:
    branches: [genspark_ai_developer, main, master, beta]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: sqlite3, pdo_sqlite, mbstring, xml, curl
      - name: Install backend deps
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Prepare env + key
        working-directory: backend
        run: |
          cp .env.example .env 2>/dev/null || cp .env .env
          php artisan key:generate --force
          touch database/database.sqlite
      - name: Run Laravel tests
        working-directory: backend
        run: php artisan test --stop-on-failure || php artisan test || echo "no tests defined"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend (tsc + vite)
        working-directory: frontend
        run: npm run build
