version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: immo-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: immo
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: immo_secret
      MYSQL_USER: immo
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - immo-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend Laravel
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: immo-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: immo
      DB_USERNAME: immo
      DB_PASSWORD: immo_secret
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./backend:/app/backend
      - /app/backend/vendor
      - backend_storage:/app/backend/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - immo-network

  # Frontend Nginx
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    container_name: immo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - immo-network

  # Redis Cache/Queue
  redis:
    image: redis:7-alpine
    container_name: immo-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - immo-network

  # (Optionnel) phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: immo-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - immo-network

volumes:
  db_data:
  redis_data:
  backend_storage:

networks:
  immo-network:
    driver: bridge
