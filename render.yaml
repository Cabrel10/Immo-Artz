databases:
  - name: immo-db
    plan: free
    region: oregon
    databaseName: immo_db
    user: immo_user

services:
  # ============================================
  # BACKEND LARAVEL (Docker)
  # ============================================
  - type: web
    name: immo-backend
    runtime: docker
    plan: free
    region: oregon
    branch: beta
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: IMMO
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: immo-backend
          property: url
      - key: FRONTEND_URL
        fromService:
          type: web
          name: immo-frontend
          property: url
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: immo-db
          property: host
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        fromDatabase:
          name: immo-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: immo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: immo-db
          property: password
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: file
      - key: LOG_CHANNEL
        value: stderr
      - key: FILESYSTEM_DISK
        value: public
      - key: IMMO_UPLOAD_DISK
        value: public
      - key: PAYMENT_DRIVER
        value: fake
      - key: CATALOG_PRICE
        value: "2000"
      - key: CATALOG_PASSWORD_VALIDITY
        value: "12"
      - key: CATALOG_PASSWORD_MAX_USES
        value: "100"
      - key: MAIL_MAILER
        value: log
      - key: CORS_ALLOWED_ORIGINS
        value: ""

  # ============================================
  # FRONTEND REACT/VITE (Static Site)
  # ============================================
  - type: web
    name: immo-frontend
    runtime: static
    plan: free
    region: oregon
    branch: beta
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: immo-backend
          property: url
      - key: NODE_VERSION
        value: "22"
